name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    name: Test (Go ${{ matrix.go }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        go: ["1.26"]

    steps:
      - uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version: ${{ matrix.go }}

      - name: Download dependencies
        run: go mod download

      - name: Vet
        run: go vet ./...

      # Nothing is excluded here: no test-name filter and no build tags. The one
      # test needing an external toolchain skips itself when the tools are
      # absent, so this run covers every test in the module.
      - name: Tests
        run: go test ./... -v

  integration:
    name: Integration Test
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version: "1.26"

      - name: Install Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "20"

      - name: Install mmdc
        run: npm install -g @mermaid-js/mermaid-cli

      # PDF printing drives Chromium over the DevTools Protocol from Go, so a
      # browser is all that is needed here — no Python and no Playwright. The
      # runner image ships Google Chrome, which ChromiumPath finds; this step
      # fails loudly if that ever stops being true, rather than letting the
      # print stage fail deeper down.
      - name: Verify a browser is available
        run: |
          for candidate in \
            "$CHROME_PATH" \
            /usr/bin/google-chrome \
            /usr/bin/chromium \
            /usr/bin/chromium-browser; do
            if [ -n "$candidate" ] && [ -x "$candidate" ]; then
              echo "browser: $candidate"
              "$candidate" --version || true
              exit 0
            fi
          done
          echo "no Chromium or Chrome found on the runner" >&2
          exit 1

      - name: Install Noto CJK fonts
        run: sudo apt-get install -y fonts-noto-cjk

      # The same command as the job above. The only difference is that the
      # toolchain is installed here, and MD2PDF_REQUIRE_INTEGRATION makes a
      # missing tool fail instead of skip, so a broken install cannot pass
      # silently.
      - name: Tests (with the integration toolchain)
        env:
          MD2PDF_REQUIRE_INTEGRATION: "1"
        run: go test ./... -v -timeout 120s

  build:
    name: Build cross-platform
    runs-on: ubuntu-latest
    needs: test

    steps:
      - uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version: "1.26"

      - name: Build Linux amd64
        run: GOOS=linux GOARCH=amd64 go build -o dist/md2pdf-linux-amd64 ./cmd/md2pdf

      - name: Build macOS amd64
        run: GOOS=darwin GOARCH=amd64 go build -o dist/md2pdf-darwin-amd64 ./cmd/md2pdf

      - name: Build macOS arm64
        run: GOOS=darwin GOARCH=arm64 go build -o dist/md2pdf-darwin-arm64 ./cmd/md2pdf

      - name: Build Windows amd64
        run: GOOS=windows GOARCH=amd64 go build -o dist/md2pdf-windows-amd64.exe ./cmd/md2pdf
