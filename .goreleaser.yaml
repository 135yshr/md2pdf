version: 2

builds:
  - id: md2pdf
    main: ./cmd/md2pdf
    binary: md2pdf
    env:
      - CGO_ENABLED=0
    ldflags:
      - -s -w
      - -X main.version={{.Version}}
      - -X main.commit={{.ShortCommit}}
      - -X main.date={{.Date}}
    targets:
      - linux_amd64
      - linux_arm64
      - darwin_amd64
      - darwin_arm64
      - windows_amd64

  # Invoked under the name mdview, the same binary defaults to -format console.
  # Everywhere a symlink works, that name is one: the Homebrew formula below
  # creates it, and the README tells archive and `go install` users the single
  # `ln -s` to run. A zip cannot carry a symlink and Windows does not create one
  # without extra privileges, so Windows — and only Windows — gets a second real
  # binary in its archive. Nothing here selects the format: the binary reads the
  # name it was invoked as.
  - id: mdview
    main: ./cmd/md2pdf
    binary: mdview
    env:
      - CGO_ENABLED=0
    ldflags:
      - -s -w
      - -X main.version={{.Version}}
      - -X main.commit={{.ShortCommit}}
      - -X main.date={{.Date}}
    targets:
      - windows_amd64

archives:
  - formats:
      - tar.gz
    format_overrides:
      - goos: windows
        formats:
          - zip
    # The Windows archive carries two binaries (md2pdf.exe and mdview.exe) while
    # the others carry one, because only Windows cannot use a symlink for the
    # second name. GoReleaser refuses that by default, on the grounds that an
    # uneven archive confuses users; here it is the documented difference, so
    # allow it rather than splitting this into two archive entries.
    allow_different_binary_count: true

brews:
    # No `ids` filter here: it selects *archive* ids, not build ids, and the
    # single archive entry above is the default one. Homebrew already takes only
    # the darwin and linux archives, which carry the md2pdf binary alone.
  - repository:
      owner: 135yshr
      name: homebrew-tap
      token: "{{ .Env.TAP_GITHUB_TOKEN }}"
    directory: Formula
    homepage: https://github.com/135yshr/md2pdf
    description: "A CLI tool that converts Markdown files to PDF with GitHub-flavored styling"
    license: MIT
    # Only what a formula can express. mmdc is required because Mermaid appears
    # in this project's own examples and a missing diagram is the most common
    # first stumble; pandoc is optional because it is needed only for
    # -format docx.
    #
    # A formula cannot depend on a cask, so the Noto CJK fonts
    # (font-noto-sans-cjk-jp) and a Chromium (the chromium cask, or Google
    # Chrome) stay manual and are documented in the README instead. Note also
    # that brew's mermaid-cli does not bring a browser of its own — md2pdf hands
    # it the one CHROME_PATH resolution finds.
    dependencies:
      - name: mermaid-cli
      - name: pandoc
        type: optional
    # The second name is a symlink rather than a second binary: it is the same
    # program, and it decides its default output format from the name it was
    # invoked as. If a real ./cmd/mdview binary is ever added, delete this —
    # the formula would otherwise try to symlink over an installed file.
    extra_install: |
      bin.install_symlink bin/"md2pdf" => "mdview"
    # Assert both names, so a broken symlink fails the release rather than the
    # first user to try it.
    test: |
      assert_match "md2pdf version", shell_output("#{bin}/md2pdf -version")
      assert_match "mdview version", shell_output("#{bin}/mdview -version")

changelog:
  sort: asc
  groups:
    - title: Added
      regexp: '^.*?:(sparkles|tada|rocket):.*$'
      order: 0
    - title: Fixed
      regexp: '^.*?:(bug|ambulance):.*$'
      order: 1
    - title: Changed
      regexp: '^.*?:(recycle|art|zap|wrench):.*$'
      order: 2
    - title: Removed
      regexp: '^.*?:(fire|wastebasket):.*$'
      order: 3
    - title: Other
      order: 999
  filters:
    exclude:
      - "^docs:"
      - "^test:"
      - "^Merge"
